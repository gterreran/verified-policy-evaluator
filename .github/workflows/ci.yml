name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, and verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and test Lean project
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: true
          build-args: "--wfail"
          nanoda: true
          nanoda-allow-sorry: false